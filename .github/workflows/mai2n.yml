name: macOS Runner Screenshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/macos-runner-screenshot.yml'

jobs:
  screenshot:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Capture macOS screen
        run: |
          echo "=== macOS Screenshot Log ===" > diagnostics.txt
          date -u >> diagnostics.txt
          sw_vers >> diagnostics.txt 2>&1 || true

          # Attempt native macOS screencapture first
          screencapture -x macos-runner-screenshot.png 2>>diagnostics.txt || true

          # If screencapture is blocked in headless session, launch Finder/Desktop or fallback via Python/Playwright
          if [ ! -s macos-runner-screenshot.png ]; then
            echo "Native screencapture empty; trying fallback..." >> diagnostics.txt
            open -a Finder 2>>diagnostics.txt || true
            sleep 1
            screencapture -x macos-runner-screenshot.png 2>>diagnostics.txt || true
          fi

          if [ ! -s macos-runner-screenshot.png ]; then
            echo "Using headless browser fallback showing macOS system info..." >> diagnostics.txt
            python3 -m venv .venv
            source .venv/bin/activate
            python3 -m pip install -q pillow
            npm init -y >/dev/null 2>&1
            npm install playwright >/dev/null 2>&1
            npx playwright install chromium >/dev/null 2>&1

            SW_INFO=$(sw_vers | tr '\n' ' | ')
            UNAME_INFO=$(uname -a)
            cat << EOF > sys_screen.html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #090d16 100%);
    color: #f8fafc;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
  }
  .win {
    width: 780px;
    background: rgba(15, 23, 42, 0.92);
    border: 1px solid rgba(148, 163, 184, 0.25);
    border-radius: 14px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    overflow: hidden;
  }
  .bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 16px;
    background: rgba(30, 41, 59, 0.85);
    border-bottom: 1px solid rgba(148, 163, 184, 0.15);
  }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .r { background: #ef4444; }
  .y { background: #eab308; }
  .g { background: #22c55e; }
  .title { margin-left: 10px; font-size: 13px; color: #cbd5e1; font-weight: 600; }
  .body { padding: 24px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; line-height: 1.7; color: #e2e8f0; }
  .k { color: #38bdf8; }
</style>
</head>
<body>
  <div class="win">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title">GitHub Actions — macOS Runner Session</span>
    </div>
    <div class="body">
      <div><span class="k">System:</span> ${SW_INFO}</div>
      <div><span class="k">Kernel:</span> ${UNAME_INFO}</div>
      <div><span class="k">Display:</span> Headless Runner (No physical monitor attached)</div>
    </div>
  </div>
</body>
</html>
EOF
            cat << 'EOF' > shot.js
const { chromium } = require('playwright');
const path = require('path');
(async () => {
  const browser = await chromium.launch({ headless: true });
  const page = await browser.newPage({ viewport: { width: 1280, height: 800 }, deviceScaleFactor: 2 });
  await page.goto('file://' + path.resolve('sys_screen.html'), { waitUntil: 'load' });
  await page.screenshot({ path: 'macos-runner-screenshot.png' });
  await browser.close();
})();
EOF
            node shot.js
          fi

          ls -lh macos-runner-screenshot.png >> diagnostics.txt 2>&1 || true

      - name: Upload Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-runner-screenshot
          path: |
            macos-runner-screenshot.png
            diagnostics.txt
