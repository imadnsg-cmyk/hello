name: Open TextEdit with Emojis & Screenshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/notes-emoji-shot.yml'

jobs:
  emoji-screenshot:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Open TextEdit with emojis and capture PNG
        run: |
          open -a TextEdit
          sleep 2

          python3 - << 'EOF'
          import subprocess

          txt = "Apple Emojis\n😂🤣🥺🤯🔥🚀💀💯🫪🫯🫍🫈\n"
          subprocess.run(["pbcopy"], input=txt.encode("utf-8"), check=False)
          EOF

          osascript -e 'tell application "TextEdit" to activate' -e 'tell application "TextEdit" to make new document with properties {text: "Apple Emojis" & return & "😂🤣🥺🤯🔥🚀💀💯🫪🫯🫍🫈"}' 2>/dev/null || true
          sleep 2
          screencapture -x macos-notes-emoji.png

      - name: Upload PNG Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notes-emoji-png
          path: macos-notes-emoji.png
