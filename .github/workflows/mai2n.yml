name: Inspect 2026 Apple Emojis & Reverse Font Structure

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-apple-2026-mod.yml'

jobs:
  inspect-reverse:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Prepare workspace & log
        run: |
          mkdir -p new_emojis_2026
          echo "=== Apple Emoji 2026 & Reverse Inspection ===" > diagnostics.txt
          date -u >> diagnostics.txt

      - name: Inspect TTC & extract new 2026 emojis
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install -q --upgrade pip
          python3 -m pip install -q fonttools pillow

          python3 - << 'EOF'
          import os, time
          from fontTools.ttLib import TTFont
          from PIL import Image, ImageDraw, ImageFont

          t0 = time.time()
          def log(msg):
              line = f"[+{time.time()-t0:.1f}s] {msg}"
              print(line, flush=True)
              with open("diagnostics.txt", "a") as f:
                  f.write(line + "\n")

          ttc_path = "/System/Library/Fonts/Apple Color Emoji.ttc"
          tt = TTFont(ttc_path, fontNumber=0)
          cmap = tt.getBestCmap() or {}

          new_2026 = [
              ("distorted_face", 0x1FAE9),
              ("fight_cloud",    0x1FAEF),
              ("orca",           0x1FACD),
              ("hairy_creature", 0x1FAC8),
              ("trombone",       0x1FAAA),
              ("landslide",      0x1F6D8),
              ("treasure_chest", 0x1FAAE),
          ]

          font_obj = None
          for sz in [160, 128]:
              try:
                  font_obj = ImageFont.truetype(ttc_path, size=sz)
                  break
              except Exception:
                  pass

          for slug, cp in new_2026:
              gname = cmap.get(cp)
              in_cmap = cp in cmap
              has_sbix = False
              sbix_sizes = []
              if "sbix" in tt and gname:
                  for ppem, strike in tt["sbix"].strikes.items():
                      if gname in strike.glyphs and strike.glyphs[gname].imageData:
                          has_sbix = True
                          sbix_sizes.append(ppem)

              log(f"{slug} (U+{cp:04X}): in_cmap={in_cmap}, glyph={gname}, sbix_strikes={sbix_sizes}")

              img = Image.new("RGBA", (180, 180), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              if font_obj is not None:
                  try:
                      draw.text((16, 12), chr(cp), font=font_obj, embedded_color=True)
                  except TypeError:
                      draw.text((16, 12), chr(cp), font=font_obj, fill=(255, 255, 255, 255))
              img.save(f"new_emojis_2026/{slug}.png", "PNG")

          # Check morx chains count if present
          if "morx" in tt:
              try:
                  chains = getattr(tt["morx"], "chains", [])
                  log(f"morx chains count: {len(chains)}")
              except Exception as e:
                  log(f"morx inspect note: {e}")

          # Build HTML preview
          cards = "\n".join(
              f'<div class="card"><img src="new_emojis_2026/{slug}.png"><div class="lbl">{slug}<br>U+{cp:04X}</div></div>'
              for slug, cp in new_2026
          )
          html = f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <style>
            body {{ font-family: -apple-system, system-ui, sans-serif; background: #0c0f14; color: #f3f4f6; padding: 24px; }}
            .grid {{ display: flex; flex-wrap: wrap; gap: 14px; }}
            .card {{ background: #151a22; border: 1px solid #263042; border-radius: 12px; padding: 12px; width: 130px; text-align: center; }}
            .card img {{ width: 76px; height: 76px; object-fit: contain; }}
            .lbl {{ margin-top: 8px; font-size: 11px; color: #cbd5e1; direction: ltr; }}
          </style>
          </head>
          <body>
            <h2>فحص إيموجيز 2026 وبنية الخط على macOS</h2>
            <div class="grid">{cards}</div>
          </body>
          </html>"""
          with open("preview_2026.html", "w", encoding="utf-8") as f:
              f.write(html)
          EOF

      - name: Render PNG preview
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1

          cat << 'EOF' > snap.js
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ deviceScaleFactor: 2 });
            await page.goto('file://' + path.resolve('preview_2026.html'), { waitUntil: 'load', timeout: 20000 });
            await page.screenshot({ path: 'preview-2026.png', fullPage: true });
            await browser.close();
          })();
          EOF
          node snap.js

      - name: Upload 2026 Inspection Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apple-2026-reverse-check
          path: |
            new_emojis_2026/
            preview-2026.png
            diagnostics.txt
