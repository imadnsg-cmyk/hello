name: Full Emoji Catalog Verification & PDF/PNG Export

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emoji-full-catalog.yml'

jobs:
  full-emoji-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare workspace & diagnostics log
        run: |
          mkdir -p ~/.local/share/fonts all_emojis_out
          echo "=== Full Emoji Catalog Verification Log ===" > diagnostics.txt
          date -u >> diagnostics.txt

      - name: Download AppleEmoji.ttf with fallbacks & progress
        run: |
          {
            echo "[$(date -u +%H:%M:%S)] Downloading AppleEmoji.ttf..."
            curl -fL -sS --max-time 90 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-linux/releases/latest/download/AppleColorEmoji.ttf" \
              || curl -fL -sS --max-time 90 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-ttf/releases/latest/download/AppleColorEmoji-Linux.ttf" \
              || curl -fL -sS --max-time 90 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://raw.githubusercontent.com/samuelngs/apple-emoji-linux/master/AppleColorEmoji.ttf"
            ls -lh ~/.local/share/fonts/AppleEmoji.ttf
            fc-cache -fv
          } >> diagnostics.txt 2>&1
          cat diagnostics.txt

      - name: "Render broad emoji set from font & build comparison sheets"
        run: |
          echo "[$(date -u +%H:%M:%S)] Installing fonttools & pillow..."
          python3 -m pip install -q fonttools pillow

          echo "[$(date -u +%H:%M:%S)] Rendering broad emoji catalog..."
          python3 - << 'EOF'
          import os, time
          from fontTools.ttLib import TTFont
          from PIL import Image, ImageDraw, ImageFont

          t0 = time.time()
          def prog(msg):
              line = f"[+{time.time()-t0:.1f}s] {msg}"
              print(line, flush=True)
              with open("diagnostics.txt", "a") as f:
                  f.write(line + "\n")

          font_path = os.path.expanduser("~/.local/share/fonts/AppleEmoji.ttf")
          tt = TTFont(font_path, fontNumber=0)
          cmap = tt.getBestCmap() or {}
          prog(f"Total cmap codepoints in font: {len(cmap)}")

          # Broad Unicode emoji ranges (single codepoints across major emoji blocks)
          ranges = [
              ("Emoticons & Faces", list(range(0x1F600, 0x1F64F))),
              ("Misc Symbols & Pictographs", list(range(0x1F300, 0x1F5FF))),
              ("Transport & Map", list(range(0x1F680, 0x1F6C6))),
              ("Supplemental Symbols", list(range(0x1F900, 0x1F9FF))),
              ("Symbols & Arrows & Hearts", [
                  0x2764, 0x1F49B, 0x1F49A, 0x1F499, 0x1F49C, 0x1F5A4, 0x1F90D, 0x1F90E,
                  0x1F9E1, 0x1FA75, 0x1FA76, 0x1FA77, 0x2728, 0x1F4AF, 0x1F4A5, 0x1F4A2,
                  0x1F4A6, 0x1F4A8, 0x1F4AC, 0x1F4AD, 0x26A1, 0x2B50, 0x1F31F, 0x1F319
              ]),
          ]

          pil_font = None
          for sz in [128, 96, 72]:
              try:
                  pil_font = ImageFont.truetype(font_path, size=sz)
                  prog(f"Loaded PIL font at size={sz}")
                  break
              except Exception as e:
                  prog(f"PIL font size={sz} failed: {e}")

          sections_html = []
          total_tested = 0
          total_rendered = 0
          missing_cps = []

          for sec_name, cps in ranges:
              sec_t0 = time.time()
              cards = []
              sec_ok = 0
              for cp in cps:
                  total_tested += 1
                  in_cmap = cp in cmap
                  if not in_cmap:
                      missing_cps.append(f"U+{cp:X}")
                  ch = chr(cp)
                  fname = f"e_{cp:X}.png"
                  fpath = os.path.join("all_emojis_out", fname)

                  img = Image.new("RGBA", (120, 120), (18, 22, 29, 255))
                  draw = ImageDraw.Draw(img)
                  if pil_font and in_cmap:
                      try:
                          draw.text((14, 6), ch, font=pil_font, embedded_color=True)
                      except TypeError:
                          draw.text((14, 6), ch, font=pil_font, fill=(255, 255, 255, 255))
                      sec_ok += 1
                      total_rendered += 1
                  else:
                      draw.text((22, 48), ch, fill=(148, 163, 184, 255))

                  img.save(fpath)
                  cards.append(
                      f'<div class="item"><img src="all_emojis_out/{fname}" loading="lazy"><div class="code">U+{cp:X}</div></div>'
                  )

              prog(f"Section '{sec_name}': {sec_ok}/{len(cps)} in cmap ({time.time()-sec_t0:.1f}s)")
              sections_html.append(f"""
              <div class="section">
                <h2>{sec_name} <span class="badge">{sec_ok} / {len(cps)}</span></h2>
                <div class="grid">
                  {''.join(cards)}
                </div>
              </div>
              """)

          prog(f"Summary: {total_rendered} rendered in-cmap out of {total_tested} tested. Missing in cmap: {len(missing_cps)}")
          with open("diagnostics.txt", "a") as f:
              f.write("Sample missing codepoints: " + ", ".join(missing_cps[:40]) + "\n")

          html = f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <style>
            body {{
              font-family: system-ui, -apple-system, sans-serif;
              background: #0b0e13;
              color: #f3f4f6;
              padding: 24px;
              margin: 0;
            }}
            .header {{
              background: #141923;
              border: 1px solid #263042;
              border-radius: 14px;
              padding: 18px 22px;
              margin-bottom: 20px;
            }}
            .header h1 {{ margin: 0 0 8px 0; font-size: 20px; }}
            .stats {{ font-size: 13px; color: #9ca3af; }}
            .section {{
              background: #131820;
              border: 1px solid #222a38;
              border-radius: 14px;
              padding: 18px;
              margin-bottom: 18px;
            }}
            .section h2 {{ margin: 0 0 14px 0; font-size: 16px; color: #e2e8f0; }}
            .badge {{
              background: #1e293b;
              color: #93c5fd;
              padding: 2px 8px;
              border-radius: 999px;
              font-size: 12px;
              margin-right: 8px;
            }}
            .grid {{
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
            }}
            .item {{
              background: #0d1117;
              border: 1px solid #1e2634;
              border-radius: 8px;
              padding: 6px;
              width: 68px;
              text-align: center;
            }}
            .item img {{
              width: 44px;
              height: 44px;
              object-fit: contain;
            }}
            .code {{
              font-size: 9px;
              color: #64748b;
              margin-top: 3px;
              direction: ltr;
            }}
          </style>
          </head>
          <body>
            <div class="header">
              <h1>اختبار شامل لمجموعة كبيرة من الإيموجي من ملف الخط (111MB)</h1>
              <div class="stats">تم اختبار {total_tested} رمزاً — موجود في cmap ومرسوم: {total_rendered} — غير موجود في cmap: {len(missing_cps)}</div>
            </div>
            {''.join(sections_html)}
          </body>
          </html>
          """
          with open("full_catalog.html", "w", encoding="utf-8") as f:
              f.write(html)
          prog("full_catalog.html built.")
          EOF

      - name: Render Full Catalog PNG & PDF with progress logs
        run: |
          echo "[$(date -u +%H:%M:%S)] Installing playwright & chromium..."
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

          cat << 'EOF' > render_catalog.js
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');

          const t0 = Date.now();
          const p = (msg) => {
            const line = `[+${((Date.now() - t0) / 1000).toFixed(1)}s] ${msg}`;
            console.log(line);
            fs.appendFileSync('diagnostics.txt', line + '\n');
          };

          (async () => {
            p('Launching Chromium for full catalog...');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ deviceScaleFactor: 1.5 });
            p('Opening full_catalog.html...');
            await page.goto('file://' + path.resolve('full_catalog.html'), { waitUntil: 'load', timeout: 60000 });
            p('Capturing screenshot full-emoji-catalog.png...');
            await page.screenshot({ path: 'full-emoji-catalog.png', fullPage: true, timeout: 60000 });
            p('Generating PDF full-emoji-catalog.pdf...');
            await page.pdf({ path: 'full-emoji-catalog.pdf', format: 'A4', printBackground: true, timeout: 60000 });
            await browser.close();
            p('Full catalog export completed!');
          })();
          EOF

          node render_catalog.js

      - name: Upload Full Catalog Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-emoji-catalog-results
          path: |
            full-emoji-catalog.png
            full-emoji-catalog.pdf
            diagnostics.txt
