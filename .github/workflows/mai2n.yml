name: Open Notes, Type Emojis & Screenshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/notes-emoji-shot.yml'

jobs:
  notes-emoji-screenshot:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Open Notes, type emojis, and capture PNG
        run: |
          osascript << 'EOF'
          tell application "Notes"
            activate
            delay 1.5
            tell account "On My Mac"
              make new note at folder "Notes" with properties {body: "<h1>Apple Emojis</h1><p>😂🤣🥺🤯🔥🚀💀💯🫪🫯🫍🫈</p>"}
            end tell
          end tell
          EOF

          sleep 2
          screencapture -x macos-notes-emoji.png

      - name: Upload PNG Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notes-emoji-png
          path: macos-notes-emoji.png
