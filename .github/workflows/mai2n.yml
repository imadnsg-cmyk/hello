name: Verify Emoji Font Tables & Render Comparison

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emoji-sbix-verify.yml'

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare workspace & diagnostics log
        run: |
          mkdir -p ~/.local/share/fonts sbix_out
          echo "=== Font Inspection & Render Log ===" > diagnostics.txt
          date -u >> diagnostics.txt

      - name: Download AppleEmoji.ttf with fallbacks
        run: |
          {
            echo "[$(date -u +%H:%M:%S)] Downloading AppleEmoji.ttf..."
            curl -fL -sS --max-time 60 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-linux/releases/latest/download/AppleColorEmoji.ttf" \
              || curl -fL -sS --max-time 60 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-ttf/releases/latest/download/AppleColorEmoji-Linux.ttf" \
              || curl -fL -sS --max-time 60 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://raw.githubusercontent.com/samuelngs/apple-emoji-linux/master/AppleColorEmoji.ttf"
            ls -lh ~/.local/share/fonts/AppleEmoji.ttf
            fc-cache -fv
          } >> diagnostics.txt 2>&1
          cat diagnostics.txt

      - name: "Inspect font tables & render glyphs"
        run: |
          echo "[$(date -u +%H:%M:%S)] Installing fonttools & pillow..."
          python3 -m pip install -q fonttools pillow

          echo "[$(date -u +%H:%M:%S)] Inspecting tables & extracting/rendering emojis..."
          python3 - << 'EOF'
          import os
          from fontTools.ttLib import TTFont
          from PIL import Image, ImageDraw, ImageFont

          font_path = os.path.expanduser("~/.local/share/fonts/AppleEmoji.ttf")
          tt = TTFont(font_path, fontNumber=0)
          tables = list(tt.keys())
          print("Available font tables:", tables)

          with open("diagnostics.txt", "a") as log:
              log.write(f"\nFont tables ({len(tables)}): {tables}\n")

          targets = {
              "rocket": 0x1F680,      # 🚀
              "fire": 0x1F525,        # 🔥
              "joy": 0x1F602,         # 😂
              "pleading": 0x1F97A,    # 🥺
              "heart": 0x2764,        # ❤️
              "sparkles": 0x2728,    # ✨
              "crown": 0x1F451,       # 👑
              "camera": 0x1F4F8,      # 📸
              "party": 0x1F973,       # 🥳
              "cry": 0x1F62D,         # 😭
              "mindblown": 0x1F92F,   # 🤯
          }

          extracted = []

          # 1) Try sbix if present
          if "sbix" in tt:
              cmap = tt.getBestCmap()
              sbix = tt["sbix"]
              strikes = sorted(sbix.strikes.items(), key=lambda kv: kv[0], reverse=True)
              ppem, strike = strikes[0]
              for name, cp in targets.items():
                  glyph_name = cmap.get(cp)
                  if glyph_name and glyph_name in strike.glyphs:
                      data = strike.glyphs[glyph_name].imageData or b""
                      idx = data.find(b"\x89PNG")
                      if idx != -1:
                          out_file = f"sbix_out/{name}.png"
                          with open(out_file, "wb") as f:
                              f.write(data[idx:])
                          extracted.append((name, chr(cp), f"{name}.png", "sbix"))

          # 2) Fallback: render each emoji directly using Pillow/FreeType from AppleEmoji.ttf
          if not extracted:
              for size in [128, 96, 64]:
                  try:
                      pil_font = ImageFont.truetype(font_path, size=size)
                      break
                  except Exception:
                      pil_font = None

              for name, cp in targets.items():
                  ch = chr(cp)
                  out_file = f"sbix_out/{name}.png"
                  img = Image.new("RGBA", (140, 140), (16, 20, 26, 255))
                  draw = ImageDraw.Draw(img)
                  if pil_font:
                      try:
                          draw.text((16, 10), ch, font=pil_font, embedded_color=True)
                      except TypeError:
                          draw.text((16, 10), ch, font=pil_font, fill=(255, 255, 255, 255))
                  else:
                      draw.text((20, 45), ch, fill=(255, 255, 255, 255))
                  img.save(out_file)
                  extracted.append((name, ch, f"{name}.png", "pil-truetype"))

          with open("diagnostics.txt", "a") as log:
              log.write(f"Generated glyph PNGs: {len(extracted)} (method={extracted[0][3] if extracted else 'none'})\n")

          rows_html = "\n".join(
              f'<div class="cell"><img src="sbix_out/{fname}" alt="{ch}"><div class="cap">{ch} ({name})</div></div>'
              for name, ch, fname, _ in extracted
          )
          all_chars = "".join(ch for _, ch, _, _ in extracted)

          html = f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <style>
            body {{
              font-family: system-ui, -apple-system, sans-serif;
              background: #0d1015;
              color: #f3f4f6;
              padding: 32px;
              margin: 0;
            }}
            .card {{
              background: #171b22;
              border: 1px solid #2a303c;
              border-radius: 16px;
              padding: 24px;
              margin-bottom: 24px;
            }}
            h2 {{ margin: 0 0 14px 0; font-size: 18px; color: #e5e7eb; }}
            .hint {{ font-size: 13px; color: #9ca3af; margin-bottom: 16px; }}
            .grid {{
              display: flex;
              flex-wrap: wrap;
              gap: 16px;
            }}
            .cell {{
              background: #10141a;
              border: 1px solid #252b36;
              border-radius: 12px;
              padding: 12px;
              width: 110px;
              text-align: center;
            }}
            .cell img {{
              width: 72px;
              height: 72px;
              object-fit: contain;
            }}
            .cap {{
              margin-top: 8px;
              font-size: 12px;
              color: #cbd5e1;
            }}
            .noto-box {{
              font-size: 46px;
              line-height: 1.6;
              padding: 10px 0;
            }}
          </style>
          </head>
          <body>
            <div class="card">
              <h2>1. صور الإيموجي المستخرجة/المرسومة من ملف AppleEmoji.ttf (111MB)</h2>
              <div class="hint">الجداول المكتشفة في الملف: {', '.join(tables)}</div>
              <div class="grid">
                {rows_html}
              </div>
            </div>

            <div class="card">
              <h2>2. نفس الإيموجي برندر نظام لينكس الافتراضي للمقارنة</h2>
              <div class="noto-box">{all_chars}</div>
            </div>
          </body>
          </html>
          """
          with open("sbix_compare.html", "w", encoding="utf-8") as f:
              f.write(html)
          print("sbix_compare.html generated.")
          EOF

      - name: Render comparison PNG & PDF with progress logs
        run: |
          echo "[$(date -u +%H:%M:%S)] Installing playwright & chromium..."
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

          cat << 'EOF' > render_sbix.js
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');

          const t0 = Date.now();
          const p = (msg) => {
            const line = `[+${((Date.now() - t0) / 1000).toFixed(1)}s] ${msg}`;
            console.log(line);
            fs.appendFileSync('diagnostics.txt', line + '\n');
          };

          (async () => {
            p('Launching Chromium...');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ deviceScaleFactor: 2 });
            p('Opening sbix_compare.html...');
            await page.goto('file://' + path.resolve('sbix_compare.html'), { waitUntil: 'load', timeout: 20000 });
            p('Taking screenshot sbix-extracted-comparison.png...');
            await page.screenshot({ path: 'sbix-extracted-comparison.png', fullPage: true });
            p('Generating PDF sbix-extracted-comparison.pdf...');
            await page.pdf({ path: 'sbix-extracted-comparison.pdf', format: 'A4', printBackground: true });
            await browser.close();
            p('Done!');
          })();
          EOF

          node render_sbix.js

      - name: Upload Verification Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbix-emoji-verification
          path: |
            sbix-extracted-comparison.png
            sbix-extracted-comparison.pdf
            sbix_out/
            diagnostics.txt
