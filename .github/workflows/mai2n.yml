name: Verify Apple SBIX Emojis & Render Comparison

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emoji-sbix-verify.yml'

jobs:
  verify-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare workspace & diagnostics log
        run: |
          mkdir -p ~/.local/share/fonts sbix_out
          echo "=== SBIX Verification Log ===" > diagnostics.txt
          date -u >> diagnostics.txt

      - name: Download AppleEmoji.ttf with fallbacks
        run: |
          {
            echo "[$(date -u +%H:%M:%S)] Downloading AppleEmoji.ttf..."
            curl -fL -sS --max-time 60 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-linux/releases/latest/download/AppleColorEmoji.ttf" \
              || curl -fL -sS --max-time 60 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-ttf/releases/latest/download/AppleColorEmoji-Linux.ttf" \
              || curl -fL -sS --max-time 60 -o ~/.local/share/fonts/AppleEmoji.ttf \
              "https://raw.githubusercontent.com/samuelngs/apple-emoji-linux/master/AppleColorEmoji.ttf"
            ls -lh ~/.local/share/fonts/AppleEmoji.ttf
            fc-cache -fv
          } >> diagnostics.txt 2>&1
          cat diagnostics.txt

      - name: "Extract real PNGs directly from AppleEmoji sbix table"
        run: |
          echo "[$(date -u +%H:%M:%S)] Installing fonttools & pillow..."
          python3 -m pip install -q fonttools pillow

          echo "[$(date -u +%H:%M:%S)] Extracting sbix glyphs..."
          python3 - << 'EOF'
          import os, struct
          from fontTools.ttLib import TTFont

          font_path = os.path.expanduser("~/.local/share/fonts/AppleEmoji.ttf")
          tt = TTFont(font_path, fontNumber=0)
          cmap = tt.getBestCmap()
          sbix = tt["sbix"]

          # Choose largest strike available (e.g., 160px)
          strikes = sorted(sbix.strikes.items(), key=lambda kv: kv[0], reverse=True)
          print("Available sbix strikes (ppem):", [k for k, _ in strikes])
          ppem, strike = strikes[0]
          print(f"Using strike ppem={ppem}")

          targets = {
              "rocket": 0x1F680,      # 🚀
              "fire": 0x1F525,        # 🔥
              "joy": 0x1F602,         # 😂
              "pleading": 0x1F97A,    # 🥺
              "heart": 0x2764,        # ❤️
              "sparkles": 0x2728,    # ✨
              "crown": 0x1F451,       # 👑
              "camera": 0x1F4F8,      # 📸
              "party": 0x1F973,       # 🥳
              "cry": 0x1F62D,         # 😭
              "mindblown": 0x1F92F,   # 🤯
          }

          extracted = []
          for name, cp in targets.items():
              glyph_name = cmap.get(cp)
              if not glyph_name or glyph_name not in strike.glyphs:
                  print(f"Missing glyph for {name} (U+{cp:X}): {glyph_name}")
                  continue
              g = strike.glyphs[glyph_name]
              data = g.imageData
              if not data:
                  print(f"Empty imageData for {name} ({glyph_name})")
                  continue

              # sbix Glyph data has an 8-byte header (originOffsetX, originOffsetY, graphicType) followed by image bytes
              if len(data) > 8 and data[8:12] == b"\x89PNG":
                  img_bytes = data[8:]
                  ext = "png"
              elif data[:4] == b"\x89PNG":
                  img_bytes = data
                  ext = "png"
              else:
                  # Fallback: search PNG signature inside bytes
                  idx = data.find(b"\x89PNG")
                  if idx != -1:
                      img_bytes = data[idx:]
                      ext = "png"
                  else:
                      print(f"Non-PNG or unknown format for {name}, len={len(data)}")
                      continue

              out_file = f"sbix_out/{name}.{ext}"
              with open(out_file, "wb") as f:
                  f.write(img_bytes)
              extracted.append((name, chr(cp), f"{name}.{ext}", len(img_bytes)))
              print(f"Extracted {out_file} ({len(img_bytes)} bytes) for {chr(cp)}")

          with open("diagnostics.txt", "a") as log:
              log.write(f"\nSBIX strike used: {ppem}\nExtracted count: {len(extracted)}\n")
              for item in extracted:
                  log.write(f"  - {item}\n")

          # Build HTML comparing raw sbix extracted images vs Linux system Noto render
          rows_html = "\n".join(
              f'<div class="cell"><img src="sbix_out/{fname}" alt="{ch}"><div class="cap">{ch} ({name})</div></div>'
              for name, ch, fname, _ in extracted
          )
          all_chars = "".join(ch for _, ch, _, _ in extracted)

          html = f"""<!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
          <meta charset="UTF-8">
          <style>
            body {{
              font-family: system-ui, -apple-system, sans-serif;
              background: #0d1015;
              color: #f3f4f6;
              padding: 32px;
              margin: 0;
            }}
            .card {{
              background: #171b22;
              border: 1px solid #2a303c;
              border-radius: 16px;
              padding: 24px;
              margin-bottom: 24px;
            }}
            h2 {{ margin: 0 0 14px 0; font-size: 18px; color: #e5e7eb; }}
            .hint {{ font-size: 13px; color: #9ca3af; margin-bottom: 16px; }}
            .grid {{
              display: flex;
              flex-wrap: wrap;
              gap: 16px;
            }}
            .cell {{
              background: #10141a;
              border: 1px solid #252b36;
              border-radius: 12px;
              padding: 12px;
              width: 110px;
              text-align: center;
            }}
            .cell img {{
              width: 72px;
              height: 72px;
              object-fit: contain;
            }}
            .cap {{
              margin-top: 8px;
              font-size: 12px;
              color: #cbd5e1;
            }}
            .noto-box {{
              font-size: 46px;
              line-height: 1.6;
              padding: 10px 0;
            }}
          </style>
          </head>
          <body>
            <div class="card">
              <h2>1. إيموجي أبل الحقيقي المستخرج مباشرة من جدول sbix داخل ملف الـ 111MB</h2>
              <div class="hint">هذه صور PNG حقيقية استُخرجت من داخل ملف الخط نفسه دون الاعتماد على رندر المتصفح للخط</div>
              <div class="grid">
                {rows_html}
              </div>
            </div>

            <div class="card">
              <h2>2. نفس الإيموجي برندر نظام لينكس الافتراضي (Noto Color Emoji) للمقارنة</h2>
              <div class="noto-box">{all_chars}</div>
            </div>
          </body>
          </html>
          """
          with open("sbix_compare.html", "w", encoding="utf-8") as f:
              f.write(html)
          print("sbix_compare.html generated.")
          EOF

      - name: Render SBIX comparison PNG & PDF with progress logs
        run: |
          echo "[$(date -u +%H:%M:%S)] Installing playwright & chromium..."
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

          cat << 'EOF' > render_sbix.js
          const { chromium } = require('playwright');
          const path = require('path');
          const fs = require('fs');

          const t0 = Date.now();
          const p = (msg) => {
            const line = `[+${((Date.now() - t0) / 1000).toFixed(1)}s] ${msg}`;
            console.log(line);
            fs.appendFileSync('diagnostics.txt', line + '\n');
          };

          (async () => {
            p('Launching Chromium...');
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ deviceScaleFactor: 2 });
            p('Opening sbix_compare.html...');
            await page.goto('file://' + path.resolve('sbix_compare.html'), { waitUntil: 'load', timeout: 20000 });
            p('Taking screenshot sbix-extracted-comparison.png...');
            await page.screenshot({ path: 'sbix-extracted-comparison.png', fullPage: true });
            p('Generating PDF sbix-extracted-comparison.pdf...');
            await page.pdf({ path: 'sbix-extracted-comparison.pdf', format: 'A4', printBackground: true });
            await browser.close();
            p('Done!');
          })();
          EOF

          node render_sbix.js

      - name: Upload SBIX Verification Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbix-emoji-verification
          path: |
            sbix-extracted-comparison.png
            sbix-extracted-comparison.pdf
            sbix_out/
            diagnostics.txt
