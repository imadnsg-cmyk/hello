name: Search System Fonts & Emoji Files on macOS

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/find-system-fonts-emojis.yml'

jobs:
  search-fonts-emojis:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Search for font & emoji files across macOS
        run: |
          echo "=== macOS Font & Emoji File Search ===" > system_fonts_emojis.txt
          date -u >> system_fonts_emojis.txt
          echo "" >> system_fonts_emojis.txt

          echo "--- [1] Emoji-related files (case-insensitive) ---" >> system_fonts_emojis.txt
          find /System/Library/Fonts /Library/Fonts "$HOME/Library/Fonts" -maxdepth 4 -iname "*emoji*" -exec ls -lh {} + 2>/dev/null >> system_fonts_emojis.txt || true
          echo "" >> system_fonts_emojis.txt

          echo "--- [2] All font files (.ttc, .ttf, .otf, .woff2, .dfont) in System/Library/Fonts ---" >> system_fonts_emojis.txt
          find /System/Library/Fonts /Library/Fonts -maxdepth 4 \( -iname "*.ttc" -o -iname "*.ttf" -o -iname "*.otf" -o -iname "*.woff2" -o -iname "*.dfont" \) -exec ls -lh {} + 2>/dev/null | sort -k5 -hr >> system_fonts_emojis.txt || true
          echo "" >> system_fonts_emojis.txt

          echo "--- [3] Any emoji/symbol assets in /System/Library/PrivateFrameworks or CoreServices ---" >> system_fonts_emojis.txt
          find /System/Library/PrivateFrameworks /System/Library/CoreServices -maxdepth 4 \( -iname "*emoji*" -o -iname "*Emoji*" \) 2>/dev/null | head -n 120 >> system_fonts_emojis.txt || true

      - name: Upload Search Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-fonts-emojis-search
          path: system_fonts_emojis.txt
