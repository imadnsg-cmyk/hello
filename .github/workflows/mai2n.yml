name: Experimental PUA Glyph Injection into CBDT/CBLC Font

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pua-cbdt-inject.yml'

jobs:
  pua-inject-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare workspace & log
        run: |
          mkdir -p ~/.local/share/fonts pua_src out_font
          echo "=== PUA CBDT/CBLC Experiment Log ===" > diagnostics.txt
          date -u >> diagnostics.txt

      - name: Download base CBDT/CBLC font
        run: |
          {
            echo "[$(date -u +%H:%M:%S)] Downloading base font..."
            curl -fL -sS --max-time 90 -o ~/.local/share/fonts/BaseEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-linux/releases/latest/download/AppleColorEmoji.ttf" \
              || curl -fL -sS --max-time 90 -o ~/.local/share/fonts/BaseEmoji.ttf \
              "https://github.com/samuelngs/apple-emoji-ttf/releases/latest/download/AppleColorEmoji-Linux.ttf" \
              || curl -fL -sS --max-time 90 -o ~/.local/share/fonts/BaseEmoji.ttf \
              "https://raw.githubusercontent.com/samuelngs/apple-emoji-linux/master/AppleColorEmoji.ttf"
            ls -lh ~/.local/share/fonts/BaseEmoji.ttf
          } >> diagnostics.txt 2>&1
          cat diagnostics.txt

      - name: "Create PNGs & test PUA mapping injection into font"
        run: |
          echo "[$(date -u +%H:%M:%S)] Installing fonttools & pillow..."
          python3 -m pip install -q fonttools pillow

          python3 - << 'EOF'
          import os, time
          from fontTools.ttLib import TTFont
          from PIL import Image, ImageDraw, ImageFont

          t0 = time.time()
          def log(msg):
              line = f"[+{time.time()-t0:.1f}s] {msg}"
              print(line, flush=True)
              with open("diagnostics.txt", "a") as f:
                  f.write(line + "\n")

          base_path = os.path.expanduser("~/.local/share/fonts/BaseEmoji.ttf")
          tt = TTFont(base_path, fontNumber=0)
          log(f"Loaded base font. Tables: {list(tt.keys())}")

          items = [
              ("pua_rocket", "🚀", 0xE001),
              ("pua_fire",   "🔥", 0xE002),
              ("pua_joy",    "😂", 0xE003),
              ("pua_heart",  "❤️", 0xE004),
              ("pua_crown",  "👑", 0xE005),
              ("pua_party",  "🥳", 0xE006),
          ]

          font_pil = None
          for sz in [128, 96]:
              try:
                  font_pil = ImageFont.truetype(base_path, size=sz)
                  break
              except Exception:
                  pass

          for slug, ch, cp in items:
              img = Image.new("RGBA", (128, 128), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              if font_pil:
                  try:
                      draw.text((8, 4), ch, font=font_pil, embedded_color=True)
                  except TypeError:
                      draw.text((8, 4), ch, font=font_pil, fill=(255, 255, 255, 255))
              img.save(f"pua_src/{slug}.png", "PNG")

          cmap = tt.getBestCmap() or {}
          added_map = {}
          for slug, ch, cp in items:
              src_gname = None
              for c in ch:
                  if ord(c) in cmap:
                      src_gname = cmap[ord(c)]
                      break
              if src_gname:
                  for tbl in tt["cmap"].tables:
                      if tbl.isUnicode():
                          tbl.cmap[cp] = src_gname
                  added_map[f"U+{cp:04X}"] = (chr(cp), src_gname)

          log(f"Mapped PUA codepoints: {added_map}")

          out_ttf = "out_font/PUA_Mapped_Test.ttf"
          tt.save(out_ttf)
          log(f"Saved {out_ttf} ({os.path.getsize(out_ttf)} bytes)")

          tt2 = TTFont(out_ttf)
          cmap2 = tt2.getBestCmap() or {}
          verified = {f"U+{cp:04X}": cmap2.get(cp) for _, _, cp in items}
          log(f"Verified in saved font cmap: {verified}")

          pua_str = "".join(chr(cp) for _, _, cp in items)
          with open("pua_characters.txt", "w", encoding="utf-8") as f:
              f.write("PUA Chars (spaced): " + " ".join(chr(cp) for _, _, cp in items) + "\n")
              f.write("PUA Chars (joined): " + pua_str + "\n")
              for slug, ch, cp in items:
                  f.write(f"U+{cp:04X} -> {slug} (base: {ch}) -> glyph: {verified.get(f'U+{cp:04X}')}\n")
          EOF

      - name: Upload PUA Experiment Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pua-cbdt-experiment
          path: |
            out_font/PUA_Mapped_Test.ttf
            pua_characters.txt
            pua_src/
            diagnostics.txt
