name: Open TextEdit with Emojis & Screenshot

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/notes-emoji-shot.yml'

jobs:
  emoji-screenshot:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Write emojis to file, open in TextEdit, and capture PNG
        run: |
          python3 - << 'EOF'
          content = "Apple Emojis\n\n😂 🤣 🥺 🤯 🔥 🚀 💀 💯 🫪 🫯 🫍 🫈\n"
          with open("emojis.txt", "w", encoding="utf-8") as f:
              f.write(content)
          EOF

          open -a TextEdit emojis.txt
          sleep 2
          osascript -e 'tell application "TextEdit" to activate'
          sleep 1
          screencapture -x macos-notes-emoji.png

      - name: Upload PNG Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-notes-emoji-png
          path: macos-notes-emoji.png
