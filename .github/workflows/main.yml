name: Windows Latest QEMU VM Runner

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/win-qemu-vm.yml'

jobs:
  win-vm:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Install QEMU on Windows runner
        shell: pwsh
        run: |
          winget install --id SoftwareFreedomConservancy.QEMU -e --silent --accept-package-agreements --accept-source-agreements
          $qemuDir = "C:\Program Files\qemu"
          if (Test-Path $qemuDir) {
            "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Verify QEMU VM capability
        shell: pwsh
        run: |
          qemu-system-x86_64.exe --version
          qemu-img.exe create -f qcow2 vm_disk.qcow2 20G
          Get-Item vm_disk.qcow2 | Select-Object Name, Length
